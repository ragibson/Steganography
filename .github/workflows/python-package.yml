# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython flake8 mypy pytest pytest-cov pytest-xdist
          pip install .
      - name: Lint with flake8
        # strict failures on any linting issues
        run: flake8 .
      - name: Type checking with mypy
        # numpy no longer supports <3.12, so typing is unreliable
        if: ${{ runner.os == 'Linux' && !contains(fromJSON('["3.10", "3.11"]'), matrix.python-version) }}
        run: mypy --install-types --non-interactive
      - name: Test with pytest and code coverage
        run: pytest -v -n auto --cov
